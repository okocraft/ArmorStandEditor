[versions]
# libraries
mcmsgdef = "1.3.0"
paper = "26.2.build.121-stable"

# testing tool
junit = "6.1.3"

# testing environment
mockito = "5.23.0"
slf4j = "2.0.19"

# gradle plugins
paperweight-userdev = "2.0.0-beta.23"
run-task = "3.1.0"
gradle-plugins = "1.8.6"

[libraries]
mcmsgdef = { module = "dev.siroshun.mcmsgdef:mcmsgdef", version.ref = "mcmsgdef" }
platform-paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

# testing tool
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# testing environment
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]

paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-userdev" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
bundler = { id = "dev.siroshun.gradle.plugins.bundler", version.ref = "gradle-plugins" }
jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
