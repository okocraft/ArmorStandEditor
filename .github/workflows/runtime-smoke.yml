name: Runtime Smoke Test

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: ${{ matrix.server }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: Paper
            task: runServer
          - server: Folia
            task: runFolia

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Start ${{ matrix.server }} and verify plugin enablement
        shell: bash
        env:
          SERVER_TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail

          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          log_file="runtime-smoke.log"
          coproc SERVER { ./gradlew "$SERVER_TASK" --console=plain >"$log_file" 2>&1; }
          server_pid=$SERVER_PID
          server_input=${SERVER[1]}

          fail() {
            cat "$log_file"
            if kill -0 "$server_pid" 2>/dev/null; then
              printf 'stop\n' >&"$server_input" || true
              wait "$server_pid" || true
            fi
            exit 1
          }

          ready=false
          for _ in $(seq 1 300); do
            if grep -Fq 'Done (' "$log_file"; then
              ready=true
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              fail
            fi

            sleep 1
          done

          if [[ "$ready" != true ]]; then
            fail
          fi

          if ! grep -Fq 'Enabling ArmorStandEditor' "$log_file"; then
            fail
          fi

          printf 'stop\n' >&"$server_input"
          wait "$server_pid"
